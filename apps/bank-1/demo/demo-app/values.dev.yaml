# Development environment values for demo-app application
image:
  repository: nexus.local:8082/docker-hosted/demo-app
  tag: "dev-18"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Development specific configuration
configMap:
  data:
    APP_ENVIRONMENT: "development"
    LOG_LEVEL_APP: "DEBUG"
    LOG_LEVEL_SPRING: "INFO"
    LOG_LEVEL_HIBERNATE: "INFO"
    H2_CONSOLE_ENABLED: "true"
    JPA_SHOW_SQL: "true"
    JPA_DDL_AUTO: "create-drop"
    MANAGEMENT_ENDPOINTS: "health,info,metrics,prometheus,env,loggers"
    HEALTH_SHOW_DETAILS: "always"

serviceMonitor:
  enabled: true
  labels:
    release: prometheus  
  interval: 30s
  path: /actuator/prometheus


env:
  - name: JAVA_OPTS
    value: "-Xms256m -Xmx512m"
  - name: SERVER_PORT
    value: "8080"

springBoot:
  profiles:
    active: "dev"
  server:
    port: 8080
  management:
    endpoints:
      web:
        exposure:
          include: "health,info,metrics,prometheus,env,loggers"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
  
  # type: NodePort     
  # port: 8080
  # targetPort: 8080
  # nodePort: 30080      

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: demo-app-dev.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Disable autoscaling in development
autoscaling:
  enabled: false

# Development probes with relaxed settings
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Node selection for development
nodeSelector: {}
tolerations: []
affinity: {}