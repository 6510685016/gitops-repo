# Default values for spring-boot-chart
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: nexus.local:8082/docker-hosted/demo-app
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

serviceMonitor:
  enabled: false
  labels:
    release: prometheus  
  annotations: {}
  port: http
  path: /actuator/prometheus
  interval: 30s
  scrapeTimeout: 10s
  metricRelabelings: []
  relabelings: []
  namespaceSelector: {}


autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Spring Boot specific configurations
springBoot:
  profiles:
    active: "default"
  server:
    port: 8080
  management:
    endpoints:
      web:
        exposure:
          include: "health,info,metrics,prometheus"

# Environment variables
env: []

# ConfigMap data
configMap:
  data: {}

# Secret data
secret:
  data: {}

# Probes
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 120
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3